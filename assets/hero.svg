<svg width="100%" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
<stop offset="0%" stop-color="#05010d"/>
<stop offset="50%" stop-color="#0c0420"/>
<stop offset="100%" stop-color="#050008"/>
</linearGradient>
<radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
<stop offset="40%" stop-color="#a855f7" stop-opacity="0.5"/>
<stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
</radialGradient>
<linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#22d3ee"/>
<stop offset="50%" stop-color="#c084fc"/>
<stop offset="100%" stop-color="#a855f7"/>
<animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3"/></filter>
</defs>

<rect width="1200" height="420" fill="url(#bgGrad)"/>

<!-- starfield particles -->
<g fill="#22d3ee">
<circle cx="80" cy="60" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="200" cy="340" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="1050" cy="80" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
<circle cx="950" cy="350" r="1.3"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="40" r="1.1"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/></circle>
<circle cx="380" cy="370" r="1.5"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="1120" cy="220" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
<circle cx="40" cy="200" r="1.3"><animate attributeName="opacity" values="1;0.4;1" dur="3.8s" repeatCount="indefinite"/></circle>
</g>

<!-- neural network mesh left -->
<g stroke="#7c3aed" stroke-width="1" opacity="0.5">
<line x1="60" y1="120" x2="160" y2="80"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="3s" repeatCount="indefinite"/></line>
<line x1="60" y1="120" x2="160" y2="180"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.6s" repeatCount="indefinite"/></line>
<line x1="160" y1="80" x2="260" y2="130"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.4s" repeatCount="indefinite"/></line>
<line x1="160" y1="180" x2="260" y2="130"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.9s" repeatCount="indefinite"/></line>
<line x1="60" y1="300" x2="160" y2="260"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.1s" repeatCount="indefinite"/></line>
<line x1="160" y1="260" x2="260" y2="300"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.4s" repeatCount="indefinite"/></line>
</g>
<g fill="#c084fc">
<circle cx="60" cy="120" r="3"/><circle cx="160" cy="80" r="3"/><circle cx="160" cy="180" r="3"/>
<circle cx="260" cy="130" r="3"/><circle cx="60" cy="300" r="3"/><circle cx="160" cy="260" r="3"/><circle cx="260" cy="300" r="3"/>
</g>

<!-- neural mesh right -->
<g stroke="#22d3ee" stroke-width="1" opacity="0.45">
<line x1="940" y1="100" x2="1040" y2="60"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="2.7s" repeatCount="indefinite"/></line>
<line x1="940" y1="100" x2="1040" y2="160"><animate attributeName="opacity" values="0.6;0.2;0.6" dur="3.3s" repeatCount="indefinite"/></line>
<line x1="1040" y1="60" x2="1140" y2="110"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/></line>
<line x1="940" y1="280" x2="1040" y2="320"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.6s" repeatCount="indefinite"/></line>
<line x1="1040" y1="320" x2="1140" y2="280"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="2.2s" repeatCount="indefinite"/></line>
</g>
<g fill="#67e8f9">
<circle cx="940" cy="100" r="3"/><circle cx="1040" cy="60" r="3"/><circle cx="1040" cy="160" r="3"/>
<circle cx="1140" cy="110" r="3"/><circle cx="940" cy="280" r="3"/><circle cx="1040" cy="320" r="3"/><circle cx="1140" cy="280" r="3"/>
</g>

<!-- AI core -->
<circle cx="600" cy="200" r="70" fill="url(#coreGlow)">
<animate attributeName="r" values="60;75;60" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="600" cy="200" r="34" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity="0.8">
<animateTransform attributeName="transform" type="rotate" from="0 600 200" to="360 600 200" dur="8s" repeatCount="indefinite"/>
</circle>
<circle cx="600" cy="200" r="46" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.6" stroke-dasharray="4 6">
<animateTransform attributeName="transform" type="rotate" from="360 600 200" to="0 600 200" dur="11s" repeatCount="indefinite"/>
</circle>

<!-- data stream pulses -->
<g fill="#22d3ee">
<circle r="2.5"><animateMotion path="M260,130 C400,170 480,190 566,200" dur="2.4s" repeatCount="indefinite"/></circle>
<circle r="2.5"><animateMotion path="M940,100 C800,150 720,180 634,200" dur="2.6s" repeatCount="indefinite"/></circle>
<circle r="2.5"><animateMotion path="M260,300 C400,250 480,220 566,205" dur="2.8s" repeatCount="indefinite"/></circle>
</g>

<!-- glass panel -->
<rect x="260" y="330" width="680" height="2" fill="#a855f7" opacity="0.4"/>

<!-- title -->
<text x="600" y="280" text-anchor="middle" font-family="Consolas, monospace" font-size="44" font-weight="700" fill="url(#textGrad)">SAKSHI KOLHE</text>
<text x="600" y="310" text-anchor="middle" font-family="Consolas, monospace" font-size="14" letter-spacing="3" fill="#67e8f9" opacity="0.85">AI COMMAND CENTER &#8226; ONLINE</text>

<!-- status chip -->
<g>
<circle cx="510" cy="310" r="4" fill="#22d3ee"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
</g>
</svg>
